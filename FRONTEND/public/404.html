<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 — Page Not Found | MarketBoard</title>
    <meta name="description" content="The requested page could not be found on MarketBoard." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        color: #fafafa;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
        background: #141414;
        border: 1px solid #262626;
        border-radius: 0.75rem;
        padding: 2.5rem 2rem;
      }
      .code {
        font-family: "JetBrains Mono", monospace;
        font-size: 3.5rem;
        font-weight: 700;
        color: #22c55e;
        line-height: 1;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.875rem;
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        background-color: #fafafa;
        color: #0a0a0a;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0.5rem;
        transition: opacity 0.15s ease;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="code" aria-hidden="true">404</div>
      <h1>Page Not Found</h1>
      <p>The page or ticker you are looking for does not exist or may have been moved.</p>
      <a href="/">Return to MarketBoard</a>
    </main>
  </body>
</html>
