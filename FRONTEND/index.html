<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MarketBoard — Real-Time Stock Market Dashboard</title>
    <meta
      name="description"
      content="Real-time US stock market dashboard with interactive charts, portfolio tracking, financial health scores, and AI-powered equity research."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="http://localhost:8000/" />

    <!-- Favicons & Web Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icon-dark-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icon-light-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarketBoard" />
    <meta property="og:title" content="MarketBoard — Real-Time Stock Market Dashboard" />
    <meta
      property="og:description"
      content="Real-time US stock market dashboard with interactive charts, portfolio tracking, financial health scores, and AI-powered equity research."
    />
    <meta property="og:url" content="http://localhost:8000/" />
    <meta property="og:image" content="/apple-icon.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarketBoard — Real-Time Stock Market Dashboard" />
    <meta
      name="twitter:description"
      content="Real-time US stock market dashboard with interactive charts, portfolio tracking, financial health scores, and AI-powered equity research."
    />
    <meta name="twitter:image" content="/apple-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased">
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif; background: #0a0a0a; color: #fafafa;">
        JavaScript is required to run MarketBoard. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
